extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  transform/remove_sensitive:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - >-
            delete_matching_keys(span.attributes,
            "(?i).*(authorization|cookie|password|secret|token|prompt|completion|request\\.body|response\\.body|exception\\.(message|stacktrace)|url\\.(full|query)|http\\.(url|target)|db\\.(statement|query\\.text)).*")
      - context: spanevent
        statements:
          - >-
            delete_matching_keys(spanevent.attributes,
            "(?i).*(authorization|cookie|password|secret|token|prompt|completion|request\\.body|response\\.body|exception\\.(message|stacktrace)|url\\.(full|query)|http\\.(url|target)|db\\.(statement|query\\.text)).*")
    metric_statements:
      - context: datapoint
        statements:
          - >-
            delete_matching_keys(datapoint.attributes,
            "(?i).*(authorization|cookie|password|secret|token|prompt|completion|request\\.body|response\\.body|url\\.(full|query)|http\\.(url|target)).*")
    log_statements:
      - context: log
        statements:
          - >-
            delete_matching_keys(log.attributes,
            "(?i).*(authorization|cookie|password|secret|token|prompt|completion|request\\.body|response\\.body|exception\\.(message|stacktrace)|url\\.(full|query)|http\\.(url|target)|db\\.(statement|query\\.text)).*")
          - set(log.body, "[REDACTED]")
  redaction:
    allow_all_keys: true
    redact_all_types: true
    blocked_key_patterns:
      - "(?i).*(authorization|cookie|password|secret|token).*"
    blocked_values:
      - "(?i)bearer\\s+[a-z0-9._~+/=-]+"
      - "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
      - "(?:[0-9]{1,3}\\.){3}[0-9]{1,3}"
    summary: silent
    url_sanitizer:
      enabled: true
      attributes:
        - http.url
        - url.full
      sanitize_span_name: true
  batch:
    send_batch_size: 1024
    timeout: 5s

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:9464
  otlp_http/loki:
    endpoint: http://loki:3100/otlp

service:
  extensions:
    - health_check
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - transform/remove_sensitive
        - redaction
        - batch
      exporters:
        - otlp_grpc/tempo
    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - transform/remove_sensitive
        - redaction
        - batch
      exporters:
        - prometheus
    logs:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - transform/remove_sensitive
        - redaction
        - batch
      exporters:
        - otlp_http/loki
  telemetry:
    logs:
      level: info
