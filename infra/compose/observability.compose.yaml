name: poseidon-observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    restart: unless-stopped
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - 127.0.0.1:4317:4317
      - 127.0.0.1:4318:4318
      - 127.0.0.1:9464:9464
      - 127.0.0.1:13133:13133
    depends_on:
      - loki
      - tempo
    networks:
      - observability

  tempo:
    image: grafana/tempo:2.10.5
    command:
      - -config.file=/etc/tempo/config.yaml
    restart: unless-stopped
    volumes:
      - ./tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - 127.0.0.1:3200:3200
    networks:
      - observability

  loki:
    image: grafana/loki:3.7.2
    command:
      - -config.file=/etc/loki/config.yaml
    restart: unless-stopped
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - 127.0.0.1:3100:3100
    networks:
      - observability

  prometheus:
    image: prom/prometheus:v3.12.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    restart: unless-stopped
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./prometheus-rules.yaml:/etc/prometheus/rules/poseidon.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - 127.0.0.1:9090:9090
    depends_on:
      - otel-collector
    networks:
      - observability

  grafana:
    image: grafana/grafana:13.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${POSEIDON_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${POSEIDON_GRAFANA_ADMIN_PASSWORD:?defina POSEIDON_GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      - loki
      - prometheus
      - tempo
    networks:
      - observability

networks:
  observability:
    name: poseidon-observability

volumes:
  grafana-data:
  loki-data:
  prometheus-data:
  tempo-data:
