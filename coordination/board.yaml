  - "F4/claude-opus: o redirect de /approvals aponta para /documents?tab=approvals; a aba ainda nao existe. F9 precisa ler o parametro `tab` ao unificar Documentos, senao o endereco antigo cai na tela sem abrir a aba."
  - "F4/claude-opus: o Dashboard mantem seletor de projeto proprio ('Projeto ativo', #cockpit-project) alem do global do cabecalho. Migrar a tela e da F3 (a fronteira da F4 proibe): trocar por `useActiveProject()` e remover o seletor local."
  - "F4/claude-opus: a rota raiz continua indo para /cockpit. D6 poe o Chat como primeiro item do menu (feito), mas mudar a aterrissagem para /chat mexe no fluxo de onboarding e em varios specs — recomendado, deixado fora do escopo minimo da fase."
