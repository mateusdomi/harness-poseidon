achados:
  - "URGENTE — TODOS OS AGENTES, REBASEIEM ANTES DE CONTINUAR. O clone do dono (~/Documents/harness-poseidon-backend) tinha 19 commits locais NUNCA empurrados, com 71 arquivos e +4383 linhas de trabalho que a campanha estava refazendo do zero. Publicados em develop em 2026-07-29 (autorizacao explicita do dono) apos rebase limpo — os commits remotos so tocavam o board. Ja existem no develop: modo de apresentacao (`frontend/src/app/presentation/{presentation-policy,use-presentation-policy}.ts` + `stores/presentation-store.ts`) que e materia da F1/F4; politica de comunicacao do Chefe (`ChiefCommunicationPolicy.cs`) e experiencia de chat de negocio, materia da F2; progresso canonico de fase e humanizacao do dashboard, materia da F3; quadro business-first, materia da F7. Quem estiver nessas fases: leia o que ja existe antes de escrever — o dever agora e reconciliar, nao reimplementar."
  - "COLISAO DE MIGRATION — F5 (kimi-a): a migration 0088 JA FOI USADA (`0088_work_task_phase_tenant_index.sql`, sqlite+postgres) pelos commits do dono publicados hoje. A faixa 0088-0089 pre-alocada a F5 na arquitetura esta parcialmente ocupada: use 0089 e reivindique a partir de 0110 em migrations_extra para o que faltar. Lembrete do que 0088 custou: 6 assercoes de contagem de cabeca a atualizar (SqliteFoundationMigrationsTests, SqliteMigrationUpgradeTests.HeadCount, GovernanceReceiptRecoveryTests, ProductionDurableExecutionRecoveryTests 2x, PostgresSkipLockedPocTests) — esquecer qualquer uma deixa o develop vermelho para todos."
  - "F4/claude-opus: o modo de apresentacao (Negocio|Tecnico|Administrador) NAO existia no codigo — a arquitetura (secao 1) o supunha pronto em Configuracoes. A F4 entregou o fallback no formato que a F1 pediu: hook `usePresentationMode()` (frontend/src/features/shared/hooks) sobre `stores/presentation-mode-store.ts`, por perfil, padrao Negocio, com a troca no menu do perfil do shell. F1 (dona) pode absorver ou substituir; manter a assinatura do hook e os ids business|technical|administrator, que o menu, a busca global e os testes ja consomem."
  - "F4/claude-opus: telas escondidas do modo Negocio continuam com rota registrada — esconder do menu nao invalida deep-link. Bloqueio duro por modo, se for desejado, e decisao de F1/F11; nao inventei."
  - "F4/claude-opus: o redirect de /approvals aponta para /documents?tab=approvals; a aba ainda nao existe. F9 precisa ler o parametro `tab` ao unificar Documentos, senao o endereco antigo cai na tela sem abrir a aba."
  - "F4/claude-opus: o Dashboard mantem seletor de projeto proprio ('Projeto ativo', #cockpit-project) alem do global do cabecalho. Migrar a tela e da F3 (a fronteira da F4 proibe): trocar por `useActiveProject()` e remover o seletor local."
  - "F4/claude-opus: a rota raiz continua indo para /cockpit. D6 poe o Chat como primeiro item do menu (feito), mas mudar a aterrissagem para /chat mexe no fluxo de onboarding e em varios specs — recomendado, deixado fora do escopo minimo da fase."
  - "URGENTE — F6 (antigravity-a) foi marcada 'concluida ... 100% verificado' e integrada em develop com o build QUEBRADO: tests/Harness.IntegrationTests/Projects/ProjectBindingAuditTests.cs chamava UlidValue.New() sem argumento, e a assinatura exige DateTimeOffset. O develop inteiro parou de compilar, travando todos os agentes. Corrigido por claude-b no commit fix(f6) (reusa o 'now' que o proprio teste ja declarava). LICAO: 'verificado' precisa significar tools/backend/verify.sh executado ate o fim com codigo de saida 0 — e cuidado com pipe, './verify.sh | tail' devolve o codigo do tail, nao do verify (perdi uma rodada inteira por isso)."
  - "F12/claude-b — NAO EXISTE caminho de turno AUTODISPARADO pela Bruna: os seis pontos de enqueue (ConversationEndpoints, ChannelEndpoints, Telegram, Teams, WhatsApp, Email) nascem todos de mensagem do usuario. As guardas de laco (teto por demanda, reentrancia por plano, taxa por janela, ciclo causal) ficam prontas, duraveis e testadas, mas SEM ponto de chamada; a fase que introduzir autodisparo deve avalia-las no enqueue. CONSEQUENCIA DIRETA PARA A F2 (D17): o 'chat em loop' ao iniciar projeto NAO pode ser laco causal de turno, porque nenhum turno se autodispara — a investigacao deve recair sobre indicador de turno preso, nao sobre laco real."
  - "F12/claude-b — o executor externo MATA agente vivo por prazo: AgentRunSettings.RunTimeout (30 min) leva ProcessExternalAgentSession a Kill(entireProcessTree), contrariando a politica de espera desta fase (prazo e checkpoint, nao morte; so conclusao, escalacao, morte do processo ou lease expirada SEM heartbeat encerram a espera). Corrigir exige tocar Modules.Agents, fora do escopo declarado da F12 (Modules.Coordination/Modules.Execution/Workers do Chefe). AgentWaitPolicy.Decide ja esta pronta e testada para ser aplicada la — o veredito devolve MayReclaim=false enquanto houver heartbeat recente."
  - "F12/claude-b — as contagens de cabeca de migration agora sao SEIS e ficam em 81 (sqlite) e 82 (postgres): SqliteFoundationMigrationsTests, SqliteMigrationUpgradeTests.HeadCount, GovernanceReceiptRecoveryTests, ProductionDurableExecutionRecoveryTests (sqlite linha 36 E postgres linha 80 — sao DUAS no mesmo arquivo, a do postgres passa despercebida sem Docker) e PostgresSkipLockedPocTests. Atencao: os outros '80' de PostgresSkipLockedPocTests sao contagem de work items, nao de migrations — nao alterar."
  - "F12/claude-b — frontend/src/api/__tests__/mock-realtime.test.ts assere sobre RELOGIO DE PAREDE (intervalMs 10, espera 55ms reais, exige >=3 batidas) e falha de forma intermitente sob contencao de CPU: reprovou com 2 batidas numa rodada de 202s e passou nas duas rodadas seguintes de 92s e 66s. Recomendacao: timers falsos do vitest, que tornam a assercao exata em vez de dependente de tempo. Fora do escopo da F12 (frontend e de F1/F4); nao alterei."
  - "CAPACIDADE DA MAQUINA — com 7 agentes simultaneos o terminal chegou a 35 GB e a maquina TRAVOU, exigindo reboot do dono; meu 'dotnet test' morreu com exit 137 (OOM). Alem disso o verify.sh NAO fecha verde sem o Docker rodando, porque os testes de Postgres dependem dele, e o Docker nao volta sozinho depois do reboot. Recomendacao pratica: nao rodar verify.sh completo em paralelo com builds de outros agentes; usar -m:1 -p:UseSharedCompilation=false; e NUNCA derrubar o build-server compartilhado (varios agentes usam o mesmo tools/backend/.tooling do clone do dono)."
  - "F1/claude-a — RECONCILIACAO DO MODO DE APRESENTACAO (para a F4/claude-opus e as demais): a fronteira unica passa a ser `usePresentationMode()` exportada de `@/app/presentation`, lendo o MESMO `stores/presentation-store.ts` que o dono ja publicou (leitura sincrona, sem API, padrao Negocio, fail-closed). Quem precisa saber QUAIS modos o perfil pode escolher continua em `usePresentationPolicy()` — as duas escrevem no mesmo store. F4: abandone `features/shared/hooks/use-presentation-mode.ts` e `stores/presentation-mode-store.ts` (removido) e importe de `@/app/presentation`. ATENCAO AOS IDS: sao `business|technical|admin` — nao `administrator` —, porque esse e o tipo ja publicado em `presentation-policy.ts` e amarrado ao direito `presentation.technical`."
  - "F1/claude-a — O GATE DE VOCABULARIO ESTA LIGADO e e Default-FAIL: roda em `npm run check` (logo, dentro do verify.sh) e como job proprio de CI. Namespace i18n novo, ainda nao classificado, e varrido como Negocio — se voce criar um namespace tecnico, declare-o em TECHNICAL_NAMESPACES. COMO ESCREVER TEXTO TECNICO SEM REPROVAR: use o par de chaves que o codigo do dono ja adota e o gate reconhece sozinho — `X` (tecnica) ao lado de `businessX`, ou `XTechnical` ao lado de `X`, ou uma subarvore `technical.*`. Bloco que a tela so renderiza com `showTechnicalDetails` e declarado com o arquivo que o condiciona."
  - "F1/claude-a — chaves cruas alem do D19, corrigidas: (a) a Central de Entregas chamava `enums.documentState.*` e `enums.taskState.*`, prefixo que NAO EXISTE no catalogo — o dono via `enums.taskState.done` na tela; corrigi 2 linhas em `features/delivery/components/delivery-overview.tsx`, path da F5, para estancar o vazamento; (b) o editor de fluxo nao tinha `workflows.editor.entryConditionsLabel/exitConditionsLabel` (relacionado ao layout quebrado do D18, F11-a). A varredura de cobertura de contrato agora falha o build para qualquer valor de enum sem rotulo nos dois idiomas."
  - "F1/claude-a — as excecoes do gate apontam a fase dona e sao divida declarada, nao perdao: F2 (seletor de modelo no compositor), F4 (rotulos de menu tecnico em `nav.*`), F5 (planejamento/diaria/fontes/graficos da Central de Entregas migram para o Assistente de PO por D10), F6 (formulario completo de projeto so no Tecnico por D12), F8 (definicoes de agente e diagnostico do Chefe), F11 (passo a passo de canal por D13, painel de diagnostico das Configuracoes). Ao mover a chave para a subarvore certa, remova a linha de EXEMPTIONS no mesmo commit."
  - "F1/claude-a — a suite de frontend e FLAKY sob contencao e isso NAO e da campanha: reproduzi as mesmas falhas intermitentes (board arquivar em lote, template admin de workflows, mock-realtime) em `origin/develop` intacto, e a suite completa em paralelo total chegou a ser morta por falta de memoria (exit 137), derrubando junto o host de homologacao do dono. Com ~7 agentes na maquina, rode `npx vitest run --poolOptions.forks.minForks=1 --poolOptions.forks.maxForks=3` para ter sinal confiavel antes de acusar regressao alheia."
  - "F5/claude-a — RETOMADA DE FASE ORFA: o dono declarou kimi-a e antigravity-a offline em definitivo e autorizou a reivindicacao. O kimi-a deixou 57 arquivos NAO COMMITADOS na worktree ~/dev/poseidon-kimi-a, sobre uma arvore anterior aos 19 commits do dono: migrations 0088-0089 (prazo de entrega e exportacao de documentos), prazo no contrato/dominio/stores de projeto, saida do turno do Chefe, migracao da Central de Entregas para o Assistente de PO (po-assistant) e um e2e de rastreamento. NADA foi apagado — a worktree dele segue intacta e o trabalho esta preservado tambem como patch. A F5 retomada usa isso como insumo, renumerando a migration 0088 (ja ocupada pelo dono) para a faixa livre."
